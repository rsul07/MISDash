<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Последовательность обработки данных в MIS Dash</title>
  <desc id="desc">Загрузка или генерация JSON, единый parser pipeline, расчёты дашборда и отдельный ИИ-запрос по кнопке.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .participant { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 8; ry: 8; }
      .external { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; rx: 8; ry: 8; }
      .ai { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; ry: 8; }
      .p-title { font-size: 15px; font-weight: 700; }
      .p-sub { font-size: 11px; fill: #475569; }
      .lifeline { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .message { fill: none; stroke: #334155; stroke-width: 1.8; marker-end: url(#arrow); }
      .return { fill: none; stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 6 4; marker-end: url(#arrow-muted); }
      .message-ai { fill: none; stroke: #059669; stroke-width: 1.8; marker-end: url(#arrow-green); }
      .self { fill: none; stroke: #334155; stroke-width: 1.8; marker-end: url(#arrow); }
      .label { font-size: 12px; }
      .label-small { font-size: 11px; }
      .frame-label { font-size: 13px; font-weight: 700; }
      .number { font-size: 10px; fill: #ffffff; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1600" height="1040" fill="#ffffff"/>
  <text x="800" y="30" text-anchor="middle" class="title">Последовательность обработки данных</text>

  <!-- Participants -->
  <g>
    <rect x="20" y="45" width="120" height="58" class="external"/>
    <text x="80" y="80" text-anchor="middle" class="p-title">Врач</text>

    <rect x="185" y="45" width="130" height="58" class="participant"/>
    <text x="250" y="70" text-anchor="middle" class="p-title">Streamlit UI</text>
    <text x="250" y="89" text-anchor="middle" class="p-sub">src/app</text>

    <rect x="350" y="45" width="140" height="58" class="participant"/>
    <text x="420" y="70" text-anchor="middle" class="p-title">Generator</text>
    <text x="420" y="89" text-anchor="middle" class="p-sub">src/generator</text>

    <rect x="520" y="45" width="140" height="58" class="participant"/>
    <text x="590" y="70" text-anchor="middle" class="p-title">Pipeline</text>
    <text x="590" y="89" text-anchor="middle" class="p-sub">src/app/data.py</text>

    <rect x="690" y="45" width="140" height="58" class="participant"/>
    <text x="760" y="70" text-anchor="middle" class="p-title">MISParser</text>
    <text x="760" y="89" text-anchor="middle" class="p-sub">src/parser</text>

    <rect x="860" y="45" width="140" height="58" class="participant"/>
    <text x="930" y="70" text-anchor="middle" class="p-title">Backend</text>
    <text x="930" y="89" text-anchor="middle" class="p-sub">DashboardService</text>

    <rect x="1030" y="45" width="140" height="58" class="participant"/>
    <text x="1100" y="70" text-anchor="middle" class="p-title">Calculators</text>
    <text x="1100" y="89" text-anchor="middle" class="p-sub">src/calculators</text>

    <rect x="1200" y="45" width="140" height="58" class="ai"/>
    <text x="1270" y="70" text-anchor="middle" class="p-title">Summary</text>
    <text x="1270" y="89" text-anchor="middle" class="p-sub">SummaryService</text>

    <rect x="1370" y="45" width="140" height="58" class="external"/>
    <text x="1440" y="70" text-anchor="middle" class="p-title">Gemini API</text>
    <text x="1440" y="89" text-anchor="middle" class="p-sub">внешний сервис</text>
  </g>

  <!-- Lifelines -->
  <g>
    <line x1="80" y1="103" x2="80" y2="1015" class="lifeline"/>
    <line x1="250" y1="103" x2="250" y2="1015" class="lifeline"/>
    <line x1="420" y1="103" x2="420" y2="1015" class="lifeline"/>
    <line x1="590" y1="103" x2="590" y2="1015" class="lifeline"/>
    <line x1="760" y1="103" x2="760" y2="1015" class="lifeline"/>
    <line x1="930" y1="103" x2="930" y2="1015" class="lifeline"/>
    <line x1="1100" y1="103" x2="1100" y2="1015" class="lifeline"/>
    <line x1="1270" y1="103" x2="1270" y2="1015" class="lifeline"/>
    <line x1="1440" y1="103" x2="1440" y2="1015" class="lifeline"/>
  </g>

  <!-- Helper: numbered messages -->
  <g>
    <circle cx="105" cy="130" r="10" fill="#334155"/><text x="105" y="134" text-anchor="middle" class="number">1</text>
    <line x1="80" y1="130" x2="250" y2="130" class="message"/>
    <rect x="112" y="111" width="115" height="18" fill="#ffffff"/>
    <text x="169" y="124" text-anchor="middle" class="label">Выбирает источник</text>
  </g>

  <!-- Alternative source frame -->
  <rect x="52" y="151" width="465" height="184" fill="#fffaf0" fill-opacity="0.72" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M 52 151 H 265 L 250 174 H 52 Z" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="63" y="168" class="frame-label">alt · загрузка готового JSON</text>

  <circle cx="105" cy="195" r="10" fill="#334155"/><text x="105" y="199" text-anchor="middle" class="number">2</text>
  <line x1="80" y1="195" x2="250" y2="195" class="message"/>
  <rect x="117" y="176" width="102" height="18" fill="#fffaf0"/>
  <text x="168" y="190" text-anchor="middle" class="label">Загружает JSON</text>

  <line x1="52" y1="220" x2="517" y2="220" stroke="#f59e0b" stroke-width="1.3"/>
  <rect x="52" y="220" width="222" height="23" fill="#ffedd5" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="63" y="237" class="frame-label">else · синтетическая выгрузка</text>

  <circle cx="105" cy="264" r="10" fill="#334155"/><text x="105" y="268" text-anchor="middle" class="number">3</text>
  <line x1="80" y1="264" x2="250" y2="264" class="message"/>
  <rect x="105" y="245" width="124" height="18" fill="#fffaf0"/>
  <text x="167" y="258" text-anchor="middle" class="label-small">Seed, годы, light</text>

  <circle cx="275" cy="294" r="10" fill="#334155"/><text x="275" y="298" text-anchor="middle" class="number">4</text>
  <line x1="250" y1="294" x2="420" y2="294" class="message"/>
  <rect x="281" y="275" width="119" height="18" fill="#fffaf0"/>
  <text x="340" y="288" text-anchor="middle" class="label-small">generate_json_bytes</text>

  <circle cx="395" cy="320" r="10" fill="#64748b"/><text x="395" y="324" text-anchor="middle" class="number">5</text>
  <line x1="420" y1="320" x2="250" y2="320" class="return"/>
  <rect x="289" y="302" width="92" height="17" fill="#fffaf0"/>
  <text x="335" y="315" text-anchor="middle" class="label-small">UTF-8 JSON bytes</text>

  <!-- Deterministic processing -->
  <circle cx="275" cy="365" r="10" fill="#334155"/><text x="275" y="369" text-anchor="middle" class="number">6</text>
  <line x1="250" y1="365" x2="590" y2="365" class="message"/>
  <rect x="337" y="346" width="166" height="18" fill="#ffffff"/>
  <text x="420" y="360" text-anchor="middle" class="label">build_pipeline(file_bytes)</text>

  <circle cx="615" cy="400" r="10" fill="#334155"/><text x="615" y="404" text-anchor="middle" class="number">7</text>
  <line x1="590" y1="400" x2="760" y2="400" class="message"/>
  <rect x="621" y="381" width="112" height="18" fill="#ffffff"/>
  <text x="677" y="395" text-anchor="middle" class="label-small">parse_record()</text>

  <circle cx="785" cy="435" r="10" fill="#334155"/><text x="785" y="439" text-anchor="middle" class="number">8</text>
  <path d="M 760 435 H 817 V 460 H 760" class="self"/>
  <rect x="792" y="416" width="154" height="18" fill="#ffffff"/>
  <text x="869" y="430" text-anchor="middle" class="label-small">Нормализация → PatientRecord</text>

  <circle cx="735" cy="485" r="10" fill="#64748b"/><text x="735" y="489" text-anchor="middle" class="number">9</text>
  <line x1="760" y1="485" x2="590" y2="485" class="return"/>
  <rect x="622" y="466" width="108" height="18" fill="#ffffff"/>
  <text x="676" y="480" text-anchor="middle" class="label-small">PatientRecord 1.0</text>

  <circle cx="615" cy="520" r="10" fill="#334155"/><text x="615" y="524" text-anchor="middle" class="number">10</text>
  <line x1="590" y1="520" x2="930" y2="520" class="message"/>
  <rect x="706" y="501" width="108" height="18" fill="#ffffff"/>
  <text x="760" y="515" text-anchor="middle" class="label">build(record)</text>

  <circle cx="955" cy="555" r="10" fill="#334155"/><text x="955" y="559" text-anchor="middle" class="number">11</text>
  <line x1="930" y1="555" x2="1100" y2="555" class="message"/>
  <rect x="960" y="536" width="112" height="18" fill="#ffffff"/>
  <text x="1016" y="550" text-anchor="middle" class="label-small">eGFR, липиды, АД</text>

  <circle cx="1075" cy="590" r="10" fill="#64748b"/><text x="1075" y="594" text-anchor="middle" class="number">12</text>
  <line x1="1100" y1="590" x2="930" y2="590" class="return"/>
  <rect x="955" y="571" width="120" height="18" fill="#ffffff"/>
  <text x="1015" y="585" text-anchor="middle" class="label-small">Значения + source_ids</text>

  <circle cx="955" cy="625" r="10" fill="#334155"/><text x="955" y="629" text-anchor="middle" class="number">13</text>
  <path d="M 930 625 H 990 V 650 H 930" class="self"/>
  <rect x="963" y="606" width="186" height="18" fill="#ffffff"/>
  <text x="1056" y="620" text-anchor="middle" class="label-small">Профиль, метрики, лента приёмов</text>

  <circle cx="905" cy="675" r="10" fill="#64748b"/><text x="905" y="679" text-anchor="middle" class="number">14</text>
  <line x1="930" y1="675" x2="590" y2="675" class="return"/>
  <rect x="694" y="656" width="132" height="18" fill="#ffffff"/>
  <text x="760" y="670" text-anchor="middle" class="label-small">DashboardResponse 1.1</text>

  <circle cx="565" cy="710" r="10" fill="#64748b"/><text x="565" y="714" text-anchor="middle" class="number">15</text>
  <line x1="590" y1="710" x2="250" y2="710" class="return"/>
  <rect x="349" y="691" width="142" height="18" fill="#ffffff"/>
  <text x="420" y="705" text-anchor="middle" class="label-small">Record + Dashboard</text>

  <circle cx="225" cy="745" r="10" fill="#64748b"/><text x="225" y="749" text-anchor="middle" class="number">16</text>
  <line x1="250" y1="745" x2="80" y2="745" class="return"/>
  <rect x="105" y="726" width="122" height="18" fill="#ffffff"/>
  <text x="166" y="740" text-anchor="middle" class="label-small">Разделы дашборда</text>

  <!-- Optional AI summary frame -->
  <rect x="52" y="770" width="1430" height="247" fill="#f0fdf4" fill-opacity="0.75" stroke="#22c55e" stroke-width="1.5"/>
  <path d="M 52 770 H 350 L 335 793 H 52 Z" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="63" y="787" class="frame-label">opt · врач нажал «Сформировать ИИ-сводку»</text>

  <circle cx="105" cy="818" r="10" fill="#059669"/><text x="105" y="822" text-anchor="middle" class="number">17</text>
  <line x1="80" y1="818" x2="250" y2="818" class="message-ai"/>
  <rect x="116" y="799" width="102" height="18" fill="#f0fdf4"/>
  <text x="167" y="813" text-anchor="middle" class="label-small">Явный запрос</text>

  <circle cx="275" cy="848" r="10" fill="#059669"/><text x="275" y="852" text-anchor="middle" class="number">18</text>
  <line x1="250" y1="848" x2="1270" y2="848" class="message-ai"/>
  <rect x="668" y="829" width="184" height="18" fill="#f0fdf4"/>
  <text x="760" y="843" text-anchor="middle" class="label-small">summarize(record, dashboard)</text>

  <circle cx="1295" cy="878" r="10" fill="#059669"/><text x="1295" y="882" text-anchor="middle" class="number">19</text>
  <path d="M 1270 878 H 1330 V 898 H 1270" class="message-ai"/>
  <rect x="1301" y="859" width="174" height="18" fill="#f0fdf4"/>
  <text x="1388" y="873" text-anchor="middle" class="label-small">Ограничить текстовый контекст</text>

  <circle cx="1295" cy="918" r="10" fill="#059669"/><text x="1295" y="922" text-anchor="middle" class="number">20</text>
  <line x1="1270" y1="918" x2="1440" y2="918" class="message-ai"/>
  <rect x="1304" y="899" width="104" height="18" fill="#f0fdf4"/>
  <text x="1356" y="913" text-anchor="middle" class="label-small">Prompt + schema</text>

  <circle cx="1415" cy="948" r="10" fill="#059669"/><text x="1415" y="952" text-anchor="middle" class="number">21</text>
  <line x1="1440" y1="948" x2="1270" y2="948" class="return"/>
  <rect x="1310" y="929" width="88" height="18" fill="#f0fdf4"/>
  <text x="1354" y="943" text-anchor="middle" class="label-small">ClinicalSummary</text>

  <circle cx="1245" cy="978" r="10" fill="#059669"/><text x="1245" y="982" text-anchor="middle" class="number">22</text>
  <line x1="1270" y1="978" x2="250" y2="978" class="return"/>
  <rect x="676" y="959" width="168" height="18" fill="#f0fdf4"/>
  <text x="760" y="973" text-anchor="middle" class="label-small">Проверка schema/source_ids + Markdown</text>

  <circle cx="225" cy="1003" r="10" fill="#059669"/><text x="225" y="1007" text-anchor="middle" class="number">23</text>
  <line x1="250" y1="1003" x2="80" y2="1003" class="message-ai"/>
  <rect x="96" y="984" width="140" height="18" fill="#f0fdf4"/>
  <text x="166" y="998" text-anchor="middle" class="label-small">Симптомы, находки, планы</text>
</svg>
