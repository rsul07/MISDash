<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура MIS Dash</title>
  <desc id="desc">Источники данных, детерминированная обработка, клинические расчёты, интерфейс и вызываемый по кнопке ИИ-контур.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 25px; font-weight: 700; }
      .group-title { font-size: 18px; font-weight: 700; }
      .node-title { font-size: 16px; font-weight: 700; }
      .node-path { font-size: 13px; font-weight: 600; fill: #334155; }
      .small { font-size: 12px; fill: #475569; }
      .edge-label { font-size: 12px; fill: #334155; }
      .node { stroke-width: 2; rx: 10; ry: 10; }
      .group { stroke-width: 1.5; rx: 14; ry: 14; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .edge-ai { fill: none; stroke: #059669; stroke-width: 2; marker-end: url(#arrow-green); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1600" height="1040" fill="#f8fafc"/>
  <text x="800" y="35" text-anchor="middle" class="title">Архитектура MIS Dash</text>

  <!-- External actors and systems -->
  <rect x="20" y="115" width="125" height="72" class="node" fill="#084c82" stroke="#052f52"/>
  <text x="82.5" y="157" text-anchor="middle" class="node-title" fill="#ffffff">Врач</text>

  <rect x="10" y="235" width="145" height="88" class="node" fill="#e2e8f0" stroke="#64748b"/>
  <text x="82.5" y="267" text-anchor="middle" class="node-title">
    <tspan x="82.5">JSON-выгрузка</tspan>
    <tspan x="82.5" dy="21">МИС</tspan>
  </text>
  <text x="82.5" y="306" text-anchor="middle" class="small">готовый файл</text>

  <rect x="1450" y="570" width="135" height="78" class="node" fill="#e2e8f0" stroke="#64748b"/>
  <text x="1517.5" y="604" text-anchor="middle" class="node-title">Gemini API</text>
  <text x="1517.5" y="629" text-anchor="middle" class="small">внешний сервис</text>

  <!-- System boundary -->
  <rect x="175" y="55" width="1255" height="950" class="group" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="205" y="87" class="group-title">MIS Dash · одно Python/Streamlit-приложение</text>

  <!-- Sources -->
  <rect x="210" y="105" width="1185" height="180" class="group" fill="#fffaf0" stroke="#fdba74"/>
  <text x="232" y="132" class="group-title">Источники данных</text>

  <rect x="245" y="155" width="300" height="95" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="395" y="181" text-anchor="middle" class="node-path">src/app/source.py</text>
  <text x="395" y="207" text-anchor="middle" class="node-title">Выбор источника</text>
  <text x="395" y="230" text-anchor="middle" class="small">загрузка или форма generator</text>

  <rect x="655" y="155" width="280" height="95" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="795" y="181" text-anchor="middle" class="node-path">src/generator</text>
  <text x="795" y="207" text-anchor="middle" class="node-title">Синтетическая выгрузка</text>
  <text x="795" y="230" text-anchor="middle" class="small">seed · years · light</text>

  <rect x="1045" y="155" width="305" height="95" class="node" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="1197.5" y="193" text-anchor="middle" class="node-title">Байты грязного JSON</text>
  <text x="1197.5" y="220" text-anchor="middle" class="small">единая parser boundary</text>

  <!-- Deterministic contour -->
  <rect x="210" y="310" width="1185" height="180" class="group" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="232" y="337" class="group-title">Детерминированный контур</text>

  <rect x="240" y="360" width="245" height="95" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="362.5" y="385" text-anchor="middle" class="node-path">src/parser</text>
  <text x="362.5" y="410" text-anchor="middle" class="node-title">MISParser</text>
  <text x="362.5" y="433" text-anchor="middle" class="small">чтение и нормализация</text>

  <rect x="525" y="360" width="270" height="95" class="node" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="660" y="385" text-anchor="middle" class="node-path">src/contracts/patient/v1</text>
  <text x="660" y="410" text-anchor="middle" class="node-title">PatientRecord 1.0</text>
  <text x="660" y="433" text-anchor="middle" class="small">каноническая история</text>

  <rect x="835" y="360" width="245" height="95" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="957.5" y="385" text-anchor="middle" class="node-path">src/backend</text>
  <text x="957.5" y="410" text-anchor="middle" class="node-title">DashboardService</text>
  <text x="957.5" y="433" text-anchor="middle" class="small">frontend-проекция</text>

  <rect x="1120" y="360" width="245" height="95" class="node" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="1242.5" y="385" text-anchor="middle" class="node-path">src/contracts/dashboard/v1</text>
  <text x="1242.5" y="410" text-anchor="middle" class="node-title">DashboardResponse 1.1</text>
  <text x="1242.5" y="433" text-anchor="middle" class="small">контракт интерфейса</text>

  <!-- Calculations and storage -->
  <rect x="210" y="515" width="700" height="200" class="group" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="232" y="543" class="group-title">Расчёты и хранение</text>

  <rect x="240" y="570" width="195" height="105" class="node" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="337.5" y="595" text-anchor="middle" class="node-path">src/storage</text>
  <text x="337.5" y="620" text-anchor="middle" class="node-title">patient_record.json</text>
  <text x="337.5" y="646" text-anchor="middle" class="small">опционально</text>

  <rect x="470" y="570" width="205" height="105" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="572.5" y="595" text-anchor="middle" class="node-path">src/backend/calculations</text>
  <text x="572.5" y="620" text-anchor="middle" class="node-title">Выбор входов</text>
  <text x="572.5" y="646" text-anchor="middle" class="small">совместимые измерения</text>

  <rect x="710" y="570" width="170" height="105" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="795" y="595" text-anchor="middle" class="node-path">src/calculators</text>
  <text x="795" y="620" text-anchor="middle" class="node-title">Калькуляторы</text>
  <text x="795" y="646" text-anchor="middle" class="small">чистые формулы</text>

  <!-- AI contour -->
  <rect x="940" y="515" width="455" height="200" class="group" fill="#f0fdf4" stroke="#86efac"/>
  <text x="962" y="543" class="group-title">ИИ-контур · только по кнопке</text>

  <rect x="963" y="570" width="128" height="105" class="node" fill="#ecfdf5" stroke="#059669"/>
  <text x="1027" y="595" text-anchor="middle" class="node-path">src/summarizer</text>
  <text x="1027" y="620" text-anchor="middle" class="node-title">Summary</text>
  <text x="1027" y="644" text-anchor="middle" class="small">текстовый</text>
  <text x="1027" y="661" text-anchor="middle" class="small">контекст</text>

  <rect x="1110" y="570" width="128" height="105" class="node" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="1174" y="595" text-anchor="middle" class="node-path">contracts</text>
  <text x="1174" y="620" text-anchor="middle" class="node-title">Clinical</text>
  <text x="1174" y="641" text-anchor="middle" class="node-title">Summary</text>
  <text x="1174" y="662" text-anchor="middle" class="small">JSON schema</text>

  <rect x="1257" y="570" width="115" height="105" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="1314.5" y="595" text-anchor="middle" class="node-path">app/summary.py</text>
  <text x="1314.5" y="620" text-anchor="middle" class="node-title">Markdown</text>
  <text x="1314.5" y="644" text-anchor="middle" class="small">ai_summary</text>

  <!-- Views -->
  <rect x="500" y="805" width="600" height="120" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="800" y="836" text-anchor="middle" class="node-path">src/app</text>
  <text x="800" y="867" text-anchor="middle" class="node-title">Экраны Streamlit</text>
  <text x="800" y="896" text-anchor="middle" class="small">профиль · динамика · приёмы · ИИ-сводка</text>

  <!-- Main arrows -->
  <path d="M 545 180 H 655" class="edge"/>
  <text x="600" y="168" text-anchor="middle" class="edge-label">GenerationConfig</text>
  <path d="M 500 250 V 267 H 1010 V 224 H 1045" class="edge"/>
  <text x="790" y="280" text-anchor="middle" class="edge-label">загруженный файл</text>
  <path d="M 935 202 H 1045" class="edge"/>
  <text x="990" y="190" text-anchor="middle" class="edge-label">UTF-8 JSON</text>
  <path d="M 1198 250 V 292 H 363 V 360" class="edge"/>

  <path d="M 485 408 H 525" class="edge"/>
  <path d="M 795 408 H 835" class="edge"/>
  <path d="M 1080 408 H 1120" class="edge"/>

  <path d="M 958 455 V 535 H 573 V 570" class="edge"/>
  <path d="M 675 622 H 710" class="edge"/>
  <path d="M 795 570 V 490 H 1243 V 455" class="edge-dashed"/>
  <text x="1030" y="510" text-anchor="middle" class="edge-label">производные ряды</text>

  <path d="M 660 455 V 520 H 338 V 570" class="edge-dashed"/>
  <text x="445" y="510" text-anchor="middle" class="edge-label">parse(): save</text>
  <path d="M 435 622 H 452 V 475 H 925 V 455" class="edge-dashed"/>
  <text x="670" y="467" text-anchor="middle" class="edge-label">build_from_path(): load</text>

  <path d="M 660 455 V 750 H 1027 V 675" class="edge-dashed"/>
  <text x="812" y="742" text-anchor="middle" class="edge-label">тексты приёмов и заключений</text>
  <path d="M 1243 455 V 478 H 1005 V 570" class="edge-dashed"/>
  <text x="1125" y="472" text-anchor="middle" class="edge-label">факты профиля</text>

  <path d="M 1091 622 H 1110" class="edge-ai"/>
  <path d="M 1238 622 H 1257" class="edge-ai"/>
  <path d="M 1315 675 V 775 H 960 V 805" class="edge-ai"/>
  <path d="M 1243 455 V 775 H 1000 V 805" class="edge"/>

  <!-- External arrows -->
  <path d="M 145 151 H 190 V 202 H 245" class="edge"/>
  <text x="190" y="139" text-anchor="middle" class="edge-label">выбор источника</text>
  <path d="M 155 279 H 195 V 222 H 245" class="edge"/>
  <text x="200" y="267" class="edge-label">загрузка</text>
  <path d="M 1027 570 V 505 H 1415 V 590 H 1450" class="edge-ai"/>
  <text x="1215" y="500" text-anchor="middle" class="edge-label">HTTPS · prompt + JSON Schema</text>
  <path d="M 1450 630 H 1420 V 735 H 1027 V 675" class="edge-ai"/>
  <text x="1408" y="729" text-anchor="end" class="edge-label">JSON</text>

  <text x="800" y="979" text-anchor="middle" class="small">Сплошные стрелки — основной поток · пунктир — опциональные связи и обогащение</text>
</svg>
